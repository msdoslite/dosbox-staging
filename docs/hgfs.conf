[hgfs]

# Optional unnamed host folder for the original VMSMOUNT driver. Empty disables
# the unnamed share. Named shares below work independently of this setting.
#
# HGFS provides host folders to a real DOS guest booted from a disk image.
# Install the included modified VMSMOUNT.EXE inside the guest; VMware is not
# required. These are file-level drives, not sector-addressable FAT disks.
#
# All HGFS settings require a full emulator restart. No folder is exported
# by default. Use existing absolute host paths without quotes. Do not use
# shell variables or '~'. Grant write access only to the folders you intend
# the guest to modify. Symlinks and multiply-linked files are rejected.
#
root =

# Allow writes to the unnamed root folder (read-only by default).
# This does not change the permissions of named shares.
#
write = off

# Expose the unnamed folder directly at the guest drive root. Otherwise
# it appears inside SHARED. Named shares always use the drive root.
#
flat = off

# Log HGFS operations for troubleshooting. Normally leave this disabled.
#
trace = off

# Unique share name: 1-16 ASCII letters, digits, '_' or '-'; case-insensitive.
# Empty name and root disable this slot. Configure up to eight folders.
#
# Example: share1_name = games, share1_root = /path/to/games, and
# share1_write = true. In DOS run: VMSMOUNT /L:D /SHARE:games
# For another folder configure share2_* and select a free drive letter:
# VMSMOUNT /L:E /SHARE:work. Slot numbers do not determine drive letters.
# Add these commands to the guest AUTOEXEC.BAT for automatic mounting.
#
# To detach only E:, close its files, switch to C:, then run
# VMSMOUNT /U /L:E. Other drives remain available. Detaching the final
# drive unloads the resident driver. A drive with open files is busy.
#
share1_name =

# Existing host directory exported by this named share. Use an absolute
# path without quotes. A missing directory disables only this share.
#
share1_root =

# Allow changes to this named folder (read-only by default).
#
share1_write = off

# Another named share. See share1_name for mounting instructions.
#
share2_name =

# Existing host directory exported by this named share. Use an absolute
# path without quotes. A missing directory disables only this share.
#
